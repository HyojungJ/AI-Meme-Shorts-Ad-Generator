[project]
name = "meme-fluencer"
version = "0.1.0"
description = "Meme data collection and video generation pipeline"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "beautifulsoup4>=4.12.0",
    "chromadb>=0.4.0",
    "google-genai>=1.0.0",
    "langchain>=1.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "librosa>=0.10.0",
    "opencv-python>=4.8.0",
    "openai>=1.50.0",
    "openai-whisper>=20240930",
    "pillow>=10.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "qwen-tts==0.0.5",
    "yt-dlp>=2024.0.0",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers==4.57.3",
    "peft>=0.18.1",
    "accelerate>=1.12.0",
    "ipywidgets>=8.1.8",
    "ipykernel>=7.1.0",
    "gpt-researcher>=0.14.5",
    "ddgs>=9.10.0",
    "langgraph-bigtool>=0.0.3",
    "mutagen>=1.47.0",
    "elevenlabs>=2.32.0",
    "boto3>=1.42.36",
    "qwen-tts>=0.0.5",
    "sentence-transformers>=5.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meme_collector", "content_pipeline", "common"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
