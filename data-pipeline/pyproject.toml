[project]
name = "meme-data"
version = "0.1.0"
description = "Meme data collection, processing, and analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 크롤링
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "aiohttp>=3.9.0",
    "selenium>=4.15.0",
    # 데이터 처리
    "pandas>=2.1.0",
    # API
    "google-api-python-client>=2.100.0", # YouTube
    "pytrends>=4.9.0", # Google Trends
    "google-api-python-client>=2.100.0",  # YouTube
    "pytrends>=4.9.0",                     # Google Trends
    # 데이터베이스
    "psycopg2-binary>=2.9.9", # PostgreSQL
    "sqlalchemy>=2.0.0",
    "redis>=5.0.0",
    "chromadb>=0.4.0", # Vector DB
    "chromadb>=0.4.0",                     # Vector DB
    # LLM
    "langchain>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-google-genai>=0.0.6",
    # 유틸
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "openai>=2.14.0",
    "langchain-openai>=1.1.6",
    "langchain-community>=0.4.1",
    "langgraph>=1.0.5",
    "librosa>=0.11.0",
    "matplotlib>=3.10.8",
    "scipy>=1.16.3",
    "psycopg2>=2.9.11",
    "yt-dlp>=2025.12.8",
    "faster-whisper>=1.2.1",
    "pydub>=0.25.1",
    "youtube-transcript-api>=1.2.3",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ipykernel>=6.25.0",       # Jupyter
]
