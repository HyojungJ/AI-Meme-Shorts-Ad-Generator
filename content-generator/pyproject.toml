[project]
name = "content-generator"
version = "0.1.0"
description = "밈 데이터 기반 숏폼 영상 시나리오 생성 시스템"
requires-python = ">=3.11"
dependencies = [
    # LLM
    "openai>=1.0.0",
    # HTTP
    "httpx>=0.27.0",
    # 데이터 검증
    "pydantic>=2.0.0",
    # DB
    "psycopg2-binary>=2.9.9",
    # 환경변수
    "python-dotenv>=1.0.0",
    "pandas>=2.3.3",
    "torch>=2.9.1",
    "datasets>=4.4.2",
    "transformers>=4.57.3",
    "peft>=0.18.1",
    "trl>=0.26.2",
    "ipywidgets>=8.1.8",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "ipykernel>=6.25.0",
]
